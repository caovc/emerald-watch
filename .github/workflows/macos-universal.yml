name: Build macOS apps (separate Apple Silicon and Intel)

# Uploading/pushing the project does NOT spend runner minutes.
# Dispatch only after checking the account's included usage and overage guard.
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Choose separate native packages"
        required: true
        type: choice
        default: both
        options:
          - both
          - arm64
          - x86_64
      included_quota_confirmed:
        description: "I checked included Actions quota and paid overage is blocked"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.included_quota_confirmed }}
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      BUILD_ARCHITECTURES: ${{ inputs.architecture }}
      GODOT_VERSION: "4.6.3"
      GODOT_EDITOR_SHA256: "30630f3e9b11e10b35c1f90ba8814185dcec43fae1a48345159be7552c64bfe8"
      GODOT_TEMPLATES_SHA256: "3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Prepare build paths
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/emerald-watch-tools"
          build_root="$RUNNER_TEMP/emerald-watch-macos"
          mkdir -p "$tool_root" "$build_root/app" "$build_root/artifacts/logs"
          echo "TOOL_ROOT=$tool_root" >> "$GITHUB_ENV"
          echo "BUILD_ROOT=$build_root" >> "$GITHUB_ENV"
          {
            echo "Source commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Godot: ${GODOT_VERSION}.stable (official editor and templates)"
            echo "Result: separate native macOS apps; ad-hoc signed, not notarized"
            sw_vers
            xcode-select -p
            xcodebuild -version
          } | tee "$build_root/artifacts/build-info.txt"

      - name: Install official matching Godot editor and macOS template
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 --connect-timeout 30 \
            "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" \
            --output "$TOOL_ROOT/godot.zip"
          curl --fail --location --retry 3 --connect-timeout 30 \
            "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            --output "$TOOL_ROOT/templates.tpz"
          printf '%s  %s\n' "$GODOT_EDITOR_SHA256" "$TOOL_ROOT/godot.zip" \
            "$GODOT_TEMPLATES_SHA256" "$TOOL_ROOT/templates.tpz" \
            | shasum -a 256 -c -
          unzip -q "$TOOL_ROOT/godot.zip" -d "$TOOL_ROOT/editor"
          template_dir="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          # Extract only macOS; do not retain another gigabyte of unused templates.
          unzip -j -q "$TOOL_ROOT/templates.tpz" templates/macos.zip templates/version.txt -d "$template_dir"
          test "$(tr -d '\r\n' < "$template_dir/version.txt")" = "${GODOT_VERSION}.stable"
          test -s "$template_dir/macos.zip"
          godot="$TOOL_ROOT/editor/Godot.app/Contents/MacOS/Godot"
          test -x "$godot"
          "$godot" --version | tee "$BUILD_ROOT/artifacts/logs/godot-version.log"
          grep -q "^${GODOT_VERSION}\.stable" "$BUILD_ROOT/artifacts/logs/godot-version.log"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
          rm "$TOOL_ROOT/godot.zip" "$TOOL_ROOT/templates.tpz"

      - name: Derive single-architecture templates before Godot signing
        run: |
          set -euo pipefail
          # Godot 4.6.3 selects architecture-named template entries; the official
          # archive ships universal entries, so derive native ones BEFORE export.
          python3 - <<'PYCODE'
          import copy, os, subprocess, zipfile
          from pathlib import Path

          template = Path.home() / "Library/Application Support/Godot/export_templates" / (os.environ["GODOT_VERSION"] + ".stable") / "macos.zip"
          work = Path(os.environ["TOOL_ROOT"]) / "native-templates"
          work.mkdir(parents=True, exist_ok=True)
          derived = work / "macos-native.zip"
          with zipfile.ZipFile(template) as source, zipfile.ZipFile(derived, "w") as output:
              variants = {}
              for build in ("debug", "release"):
                  matches = [entry for entry in source.infolist() if entry.filename.endswith(f"/godot_macos_{build}.universal")]
                  assert len(matches) == 1, f"Missing official {build} universal template"
                  variants[build] = matches[0]
              native_names = {entry.filename.removesuffix(".universal") + "." + arch
                              for entry in variants.values() for arch in ("arm64", "x86_64")}
              for entry in source.infolist():
                  if entry.filename not in native_names:
                      output.writestr(entry, source.read(entry))
              for build, entry in variants.items():
                  universal = work / f"{build}.universal"
                  universal.write_bytes(source.read(entry))
                  for arch in ("arm64", "x86_64"):
                      native = work / f"{build}.{arch}"
                      subprocess.run(["xcrun", "lipo", str(universal), "-thin", arch, "-output", str(native)], check=True)
                      subprocess.run(["xcrun", "lipo", str(native), "-verify_arch", arch], check=True)
                      actual = subprocess.check_output(["xcrun", "lipo", str(native), "-archs"], text=True).strip()
                      assert actual == arch, actual
                      info = copy.copy(entry)
                      info.filename = entry.filename.removesuffix(".universal") + "." + arch
                      info.orig_filename = info.filename
                      output.writestr(info, native.read_bytes())
                      print(f"Derived native template: {info.filename} ({arch})")
          os.replace(derived, template)
          PYCODE

      - name: Import game resources
        run: |
          set -euo pipefail
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --import \
            2>&1 | tee "$BUILD_ROOT/artifacts/logs/godot-import.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' \
            "$BUILD_ROOT/artifacts/logs/godot-import.log"; then
            echo "::error::Godot import reported a script error."
            exit 1
          fi

      - name: Export, verify and package separate native apps
        run: |
          set -euo pipefail
          case "$BUILD_ARCHITECTURES" in
            both) architectures=(arm64 x86_64) ;;
            arm64) architectures=(arm64) ;;
            x86_64) architectures=(x86_64) ;;
            *) echo "::error::Unsupported architecture choice"; exit 1 ;;
          esac
          for arch in "${architectures[@]}"; do
            case "$arch" in
              arm64) preset="macOS Apple Silicon" ;;
              x86_64) preset="macOS Intel" ;;
            esac
            output="$BUILD_ROOT/artifacts/$arch"
            app="$BUILD_ROOT/app/$arch/EmeraldWatch.app"
            mkdir -p "$output/logs" "$(dirname "$app")"
            cp "$BUILD_ROOT/artifacts/build-info.txt" "$output/build-info.txt"
            echo "Native architecture: $arch" >> "$output/build-info.txt"
            "$GODOT" --headless --path "$GITHUB_WORKSPACE" \
              --export-release "$preset" "$app" \
              2>&1 | tee "$output/logs/godot-export.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' "$output/logs/godot-export.log"; then
              echo "::error::Godot export reported a script error."
              exit 1
            fi
            /usr/bin/plutil -lint "$app/Contents/Info.plist"
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
            test -n "$executable"
            binary="$app/Contents/MacOS/$executable"
            test -x "$binary"
            /usr/bin/file "$binary" | tee "$output/logs/binary.log"
            grep -q 'Mach-O' "$output/logs/binary.log"
            # Input file precedes -verify_arch; that option consumes the remaining args.
            xcrun lipo "$binary" -verify_arch "$arch"
            actual_archs="$(xcrun lipo "$binary" -archs)"
            printf '%s\n' "$actual_archs" | tee "$output/logs/architectures.log"
            # Reject a fat/universal binary with an architecture-specific filename.
            test "$actual_archs" = "$arch"
            /usr/bin/codesign --verify --deep --strict --verbose=2 "$app" \
              2>&1 | tee "$output/logs/signature-verify.log"
            /usr/bin/codesign --display --verbose=4 "$app" \
              2>&1 | tee "$output/logs/signature-details.log"
            grep -q '^Signature=adhoc$' "$output/logs/signature-details.log"
            export MACOS_ARCH="$arch"
            python3 - <<'PY'
          import os, plistlib
          from pathlib import Path

          arch = os.environ["MACOS_ARCH"]
          app = Path(os.environ["BUILD_ROOT"]) / "app" / arch / "EmeraldWatch.app"
          info = plistlib.loads((app / "Contents/Info.plist").read_bytes())
          assert info["CFBundleIdentifier"] == "dev.emeraldwatch.game"
          assert info["CFBundlePackageType"] == "APPL"
          binary = app / "Contents/MacOS" / info["CFBundleExecutable"]
          assert binary.stat().st_size > 1_000_000, "Missing compiled engine"
          packs = list((app / "Contents/Resources").glob("*.pck"))
          assert len(packs) == 1 and packs[0].stat().st_size > 0, "Missing game resources"
          print(f"Verified actual {arch} app, executable, bundle ID and game pack")
          PY
            mkdir -p "$BUILD_ROOT/package/$arch"
            package="$BUILD_ROOT/package/$arch/EmeraldWatch-macOS-$arch.zip"
            /usr/bin/ditto -c -k --keepParent "$app" "$package"
            /usr/bin/ditto -x -k "$package" "$BUILD_ROOT/verify/$arch"
            restored="$BUILD_ROOT/verify/$arch/EmeraldWatch.app"
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$restored/Contents/Info.plist")
            test -x "$restored/Contents/MacOS/$executable"
            xcrun lipo "$restored/Contents/MacOS/$executable" -verify_arch "$arch"
            test "$(xcrun lipo "$restored/Contents/MacOS/$executable" -archs)" = "$arch"
            /usr/bin/codesign --verify --deep --strict "$restored"
            python3 - <<'PY'
          import os, plistlib, stat, zipfile
          from pathlib import Path

          arch = os.environ["MACOS_ARCH"]
          path = Path(os.environ["BUILD_ROOT"]) / "package" / arch / f"EmeraldWatch-macOS-{arch}.zip"
          # ditto writes UTF-8 filename bytes without always setting ZIP bit 11.
          with zipfile.ZipFile(path, metadata_encoding="utf-8") as archive:
              assert archive.testzip() is None, "Corrupt ZIP member"
              prefix = "EmeraldWatch.app/Contents/"
              info = plistlib.loads(archive.read(prefix + "Info.plist"))
              assert info["CFBundleIdentifier"] == "dev.emeraldwatch.game"
              binary = archive.getinfo(prefix + "MacOS/" + info["CFBundleExecutable"])
              assert binary.file_size > 1_000_000
              assert stat.S_IMODE(binary.external_attr >> 16) & 0o111
          print(f"Verified native ZIP round trip: {path.name} ({path.stat().st_size:,} bytes)")
          PY
            # Only publish a ZIP after all checks succeeded.
            mv "$package" "$output/"
            (
              cd "$output"
              shasum -a 256 "EmeraldWatch-macOS-$arch.zip" > "EmeraldWatch-macOS-$arch.zip.sha256"
            )
            {
              echo "### macOS $arch package verified"
              echo "Download the $arch artifact and extract EmeraldWatch-macOS-$arch.zip."
              echo 'Ad-hoc signed only; no Developer ID identity or Apple notarization. Gatekeeper may block downloaded copies.'
              echo "Source commit: $GITHUB_SHA"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload Apple Silicon package and diagnostic logs
        if: ${{ always() && env.BUILD_ROOT != '' && (inputs.architecture == 'both' || inputs.architecture == 'arm64') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EmeraldWatch-macOS-arm64-${{ github.run_number }}
          path: ${{ env.BUILD_ROOT }}/artifacts/arm64/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0

      - name: Upload Intel package and diagnostic logs
        if: ${{ always() && env.BUILD_ROOT != '' && (inputs.architecture == 'both' || inputs.architecture == 'x86_64') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EmeraldWatch-macOS-x86_64-${{ github.run_number }}
          path: ${{ env.BUILD_ROOT }}/artifacts/x86_64/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0

      - name: Upload common setup and import logs
        if: ${{ always() && env.BUILD_ROOT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EmeraldWatch-macOS-build-logs-${{ github.run_number }}
          path: |
            ${{ env.BUILD_ROOT }}/artifacts/build-info.txt
            ${{ env.BUILD_ROOT }}/artifacts/logs/
          if-no-files-found: warn
          retention-days: 3
